default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: .txt
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^tests/ ^assets/ *.txt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        stages: [pre-commit]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: pytest
        stages: [pre-commit]
        name: pytest
        entry: pytest tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--keep-id]
        exclude: ^examples/NanoPhyling-MiniPhyling/lab_examples/.*\.ipynb$
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
