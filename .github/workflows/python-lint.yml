name: python-lint

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
    python-lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Lint with ruff
              uses: astral-sh/ruff-action@v4.1.0
              with:
                version: "0.16.10"
                args: check

            - name: Format with ruff
              uses: astral-sh/ruff-action@v4.1.0
              with:
                version: "0.16.10"
                args: format --check

    python-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.13", "3.15"]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
                allow-prereleases: true

            - name: Install the package and test dependencies
              run: |
                python -m pip install --upgrade pip
                pip install pytest
                pip install -e .

            # builds the Cython extensions (decoder_utils) the tests import
            - name: Install the local package
              run: pip install -e .

            - name: Test with pytest
              run: |
                pytest tests
